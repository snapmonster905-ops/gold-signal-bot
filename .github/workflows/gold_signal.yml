name: Gold Signal Check

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-signal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run signal check
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python gold_signal_github_actions.py

      - name: Commit updated state file (if changed)
        run: |
          git config user.name "gold-signal-bot"
          git config user.email "actions@github.com"
          git add last_signal.txt || true
          git diff --quiet && git diff --staged --quiet || git commit -m "Update last signal state"
          git push || true
